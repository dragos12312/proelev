# alembic config, the bare minimum
# the actual db url is read from the DATABASE_URL env var inside env.py
# so the same migrations work for the dev sqlite file and for any test db

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = sqlite:///./proelev.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
